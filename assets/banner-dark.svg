<g stroke="#c9c9d2" fill="none">
  <g class="o1"><ellipse cx="960" cy="150" rx="150" ry="52" transform="rotate(-28 960 150)" stroke-width="2.4"/><circle cx="1103" cy="106" r="5" fill="#f2f2f4" stroke="none"/></g>
  <g class="o2"><ellipse cx="960" cy="150" rx="150" ry="52" transform="rotate(34 960 150)" stroke-width="1.2"/><circle cx="1090" cy="224" r="4" fill="#9d9da8" stroke="none"/></g>
